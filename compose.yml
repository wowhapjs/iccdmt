services:
  web:
    build:
      context: .
    container_name: iccdmt
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 31003
      CONTENT_ROOT: /content/current
    volumes:
      - /var/lib/web-manager/content/iccdmt:/content:ro
    command: ["node", "dist-server/server/index.js"]
